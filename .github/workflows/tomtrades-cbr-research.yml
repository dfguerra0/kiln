name: TomTrades CBR Research
on:
  push:
    branches: ['research/tomtrades-cbr-2026']
  pull_request:
    branches: ['v9']
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run coarse research
        run: |
          sed -i 's/cfgs(n=4000)/cfgs(n=1000)/' research/tomtrades_cbr_15m.py
          python research/tomtrades_cbr_15m.py
      - uses: actions/upload-artifact@v4
        with:
          name: tomtrades-cbr-research
          path: research/output/
